server {
    listen 80;
    server_name streamtrik.com www.streamtrik.com;

    root /home/administrator/streamtrik;
    index index.html;

    # Trust Cloudflare's real-IP header
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;

    # Serve static site
    location / {
        try_files $uri $uri/ /index.html;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Explicitly kill any service worker that was registered under / by another app
    location = /sw.js {
        return 404;
    }
    location = /service-worker.js {
        return 404;
    }

    # SEO: pre-rendered match pages + sitemap (routed to proxy.js)
    location /match/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Proxy CORS proxy on port 8765
    location /proxy {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Pre-flight stream check endpoint
    location /check {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Live sports API (tvapp1 schedule) - CORS-enabled proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Stream resolver (ad-free m3u8) - routes to Python Playwright service
    location ~ ^/(resolve|stream|seg|debug)$ {
        proxy_pass http://127.0.0.1:7879;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        tcp_nodelay on;
    }
}
